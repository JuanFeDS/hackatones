<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gambito de Sombras</title>
<style>
  html, body { margin: 0; height: 100%; background: #07060b; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #help {
    position: fixed; left: 16px; bottom: 16px; width: min(270px, calc(100vw - 32px)); box-sizing: border-box;
    padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(201, 179, 126, 0.28);
    background: rgba(10, 8, 18, 0.72); backdrop-filter: blur(4px); color: #d8d2c4;
    font: 12px/1.45 system-ui, sans-serif; pointer-events: none; z-index: 5;
  }
  #help[hidden] { display: none; }
  #help h2 { margin: 0 0 8px; font: 600 11px/1 system-ui, sans-serif; letter-spacing: 0.18em; text-transform: uppercase; color: #C9B37E; }
  #help .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 4px 0; }
  #help .keys { display: flex; flex-wrap: wrap; gap: 4px; flex: none; }
  #help kbd {
    font: 600 11px ui-monospace, monospace; padding: 1px 6px; border-radius: 4px; color: #C9B37E;
    border: 1px solid rgba(201, 179, 126, 0.4); border-bottom-width: 2px; background: rgba(201, 179, 126, 0.08);
  }
  #help .label { text-align: right; color: #b9b3a6; }
  #help.collapsed { width: auto; padding: 6px 10px; }
  #help.collapsed .row, #help.collapsed h2 { display: none; }
  #help .chip { display: none; color: #b9b3a6; }
  #help.collapsed .chip { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<aside id="help" hidden></aside>
<script src="js/core.js"></script>
<script src="js/maze.js"></script>
<script src="js/bestiary.js"></script>
<script src="js/enemies.js"></script>
<script src="js/pieces.js"></script>
<script src="js/props.js"></script>
<script src="js/sim.js"></script>
<script src="js/fx.js"></script>
<script src="js/slash.js"></script>
<script src="js/audio.js"></script>
<script src="js/render.js"></script>
<script src="js/render3d.js"></script>
<script src="js/input.js"></script>
<script src="js/main.js"></script>
</body>
</html>
