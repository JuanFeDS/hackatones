services:
  - type: web
    name: quick-logistica-analista
    runtime: docker
    rootDir: 2026-08-agents-bogota
    plan: free
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: QUICK_ANALYST_MODEL
        value: claude-sonnet-5
      - key: CLAUDE_CODE_STREAM_CLOSE_TIMEOUT
        value: "180000"
